# ===========================================================================
# security/certificate-pack.yaml: an ordered certificate pack (Advanced Certificate Manager)
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
#   certificate_authority   lets_encrypt | google | ssl_com
#   type                    advanced | custom
#   validation_method       txt | http | email
#   validity_days           14 | 30 | 90 | 365 (varies by CA)
#   hosts                   optional, defaults to the zone's hostnames
#   cloudflare_branding     optional
#
# CAREFUL: ordering a certificate pack can be a billable action depending
# on the certificate authority and type -- check Cloudflare's pricing
# before enabling this.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# certificate_authority: lets_encrypt
# type: advanced
# validation_method: txt
# validity_days: 90
#
# Check: python cf.py validate <domain>
