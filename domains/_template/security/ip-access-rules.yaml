# ===========================================================================
# security/ip-access-rules.yaml: allow, challenge or block by IP, range, ASN or country
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# ASN value: AS64496; country value: GB. notes explains why the rule exists.
#
#   mode    whitelist (always allow) | block | managed_challenge | challenge | js_challenge
#   target  ip | ip6 | ip_range | asn | country
#   value   matching value (IPv4 /16 or /24, IPv6 /32/48/64 for ranges; country = two capital letters)
#   notes   Why the rule exists — please fill this in.
#
# For long lists, use an account IP list (account/lists/ip.yaml) instead.
#
# Keep entry keys stable; renaming them deletes and recreates resources.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# office_allow:
#   mode: whitelist
#   target: ip_range
#   value: 203.0.113.0/24
#   notes: Head office
#
# Check: python cf.py validate <domain>
