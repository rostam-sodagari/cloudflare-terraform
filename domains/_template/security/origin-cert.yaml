# ===========================================================================
# security/origin-cert.yaml: Cloudflare Origin CA certificate for your origin server
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Replace the complete sample CSR; the '...' placeholder cannot be submitted.
#
#   csr                 a Certificate Signing Request YOU generate; the
#                       matching private key stays on your origin server,
#                       NEVER in this repo. A CSR is public, not secret.
#   hostnames           list of hostnames the cert covers
#   request_type        origin-rsa | origin-ecc
#   requested_validity  optional, days
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# csr: |
#   -----BEGIN CERTIFICATE REQUEST-----
#   ...
#   -----END CERTIFICATE REQUEST-----
# hostnames: [example.com, "*.example.com"]
# request_type: origin-rsa
#
# Check: python cf.py validate <domain>
