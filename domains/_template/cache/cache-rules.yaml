# ===========================================================================
# cache/cache-rules.yaml: cache rules (what Cloudflare caches and for how long)
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# TTL defaults are seconds; override_origin needs default. Extra options: docs/rule-examples.md.
#
#   cache: true | false
#   edge_ttl:    { mode: override_origin, default: <seconds> }
#   browser_ttl: { mode: respect_origin }   or override_origin + default
#
# Needs the DNS record to be proxied (orange cloud).
# CAREFUL: never cache pages with personal data (accounts, carts, admin).
#
# Required: ref, expression, action_parameters. description is optional.
# enabled defaults to true; action is set for you. Rules run top to bottom.
# Regex needs Business+. Expression examples: docs/rule-examples.md.
# Limits: Free 10, Pro 25, Business 50, Enterprise 300 rules in this file.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# - ref: cache_static
#   description: Cache static assets at the edge for a day
#   expression: (http.request.uri.path.extension in {"css" "js" "png" "jpg" "svg" "woff2"})
#   action_parameters:
#     cache: true
#     edge_ttl:
#       mode: override_origin
#       default: 86400
#
# Check: python cf.py validate <domain>
