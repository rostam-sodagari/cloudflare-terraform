# ===========================================================================
# rules/compression.yaml: compression rules
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Use algorithms: [{name: none}] to disable compression.
#
#   algorithms: [{ name: zstd | brotli | gzip | auto | default | none }, ...]  tried in order
#
# Required: ref, expression, action_parameters. description is optional.
# enabled defaults to true; action is set for you. Rules run top to bottom.
# Regex needs Business+. Expression examples: docs/rule-examples.md.
# Limits: Free 10, Pro 25, Business 50, Enterprise 300 rules in this file.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# - ref: prefer_zstd
#   description: Prefer Zstandard, then Brotli, then gzip
#   expression: "true"
#   action_parameters:
#     algorithms:
#       - name: zstd
#       - name: brotli
#       - name: gzip
#
# Check: python cf.py validate <domain>
