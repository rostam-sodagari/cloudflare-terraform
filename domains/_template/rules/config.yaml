# ===========================================================================
# rules/config.yaml: configuration rules (different settings for some requests)
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Per-request toggles use true/false, unlike quoted zone switches.
#
# action_parameters takes zone settings that apply only when the rule matches, e.g.:
#   security_level: off | essentially_off | low | medium | high | under_attack
#   ssl: off | flexible | full | strict
#   rocket_loader, email_obfuscation, automatic_https_rewrites: true | false
#
# Required: ref, expression, action_parameters. description is optional.
# enabled defaults to true; action is set for you. Rules run top to bottom.
# Regex needs Business+. Expression examples: docs/rule-examples.md.
# Limits: Free 10, Pro 25, Business 50, Enterprise 300 rules in this file.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# - ref: admin_hardening
#   description: Stricter settings on admin pages
#   expression: (starts_with(http.request.uri.path, "/admin"))
#   action_parameters:
#     security_level: high
#
# Check: python cf.py validate <domain>
