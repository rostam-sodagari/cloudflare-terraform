# ===========================================================================
# rules/redirects.yaml: single redirect rules
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Choose target_url.value OR target_url.expression, not both. status_code also accepts 303.
#
#   from_value:
#     status_code: 301 (permanent) | 302 (temporary) | 307 | 308
#     preserve_query_string: true | false
#     target_url: { value: https://... }  or  { expression: concat(...) }
#
# For hundreds of fixed old-to-new addresses use Bulk Redirects instead
# (account/lists/redirect.yaml).
#
# Required: ref, expression, action_parameters. description is optional.
# enabled defaults to true; action is set for you. Rules run top to bottom.
# Regex needs Business+. Expression examples: docs/rule-examples.md.
# Limits: Free 10, Pro 25, Business 50, Enterprise 300 rules in this file.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# - ref: www_to_apex
#   description: Redirect www to the domain, keep path and query
#   expression: (http.host eq "www.example.com")
#   action_parameters:
#     from_value:
#       status_code: 301
#       preserve_query_string: true
#       target_url:
#         expression: concat("https://example.com", http.request.uri.path)
#
# Check: python cf.py validate <domain>
