# ===========================================================================
# domain.yaml: which Cloudflare zone this folder controls (REQUIRED)
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
#   name      The domain exactly as shown in Cloudflare, e.g. example.com. Must match the folder name.
#   zone_id   Zone Overview page > API section > Zone ID (32 hex characters). Keep the quotes.
#   plan      free | pro | business | enterprise — must match the real plan.
#   owner     Team responsible for this domain (for people; not used by Terraform).
#   example   Only for test fixtures; never set it on a real domain.
#
# Check: python cf.py validate <domain>
name: DOMAIN_NAME
zone_id: "ZONE_ID"
plan: free
owner: change-me
