# Managed rulesets. Pro and above; ignored on free (Cloudflare applies the
# Free Managed Ruleset automatically).
#
#   cloudflare_managed.enabled  true | false
#   cloudflare_managed.action   optional override for every rule, e.g. log
#   owasp.enabled               true | false
#   owasp.action                action when the anomaly score is reached
#                               (start with log, move to block after tuning)
#   owasp.paranoia_level        1-4 (higher = stricter, more false positives)
#   owasp.score_threshold       60 low | 40 medium | 25 high sensitivity
#   exceptions                  skip one or both rulesets for matching traffic;
#                               placed above the execute rules automatically
#
# cloudflare_managed:
#   enabled: true
# owasp:
#   enabled: true
#   action: log
#   paranoia_level: 1
#   score_threshold: 40
# exceptions:
#   - ref: skip_owasp_webhooks
#     description: Payment webhooks trip OWASP false positives
#     expression: (http.request.uri.path eq "/webhooks/payments")
#     rulesets: [owasp]          # owasp | cloudflare_managed | raw ruleset id
