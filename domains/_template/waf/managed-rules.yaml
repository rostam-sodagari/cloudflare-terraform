# ===========================================================================
# waf/managed-rules.yaml: Cloudflare's managed WAF rulesets (Pro and above)
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Defaults: rulesets enabled; OWASP paranoia_level 1, score_threshold 40.
# Omit action for default actions. raw_rules replaces the simple form.
# Exceptions and raw examples: docs/rule-examples.md.
#
# On Free, Cloudflare applies its own Free Managed Ruleset: leave this file commented.
#
#   cloudflare_managed: { enabled, action }        common attacks, CVEs
#   owasp: { enabled, paranoia_level 1-4, score_threshold 60|40|25, action }
#   exceptions: [{ ref, description, expression, rulesets }]   skip a ruleset for matching traffic
#
# "log" action is Enterprise only. raw_rules: (written by the exporter) replaces
# the simple form entirely when present.
#
# CAREFUL: emptying this file after it has been applied DELETES the managed WAF protection.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# cloudflare_managed:
#   enabled: true
# owasp:
#   enabled: true
#   score_threshold: 60
#   action: managed_challenge
#
# Check: python cf.py validate <domain>
