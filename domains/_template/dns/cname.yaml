# CNAME records.
# ---------------------------------------------------------------------------
# HOW KEYS WORK
#   The top-level key (e.g. "www") is the record's permanent ID in Terraform.
#   Renaming a key deletes and recreates the record. Change "name" or
#   "content" freely; never rename keys casually.
#
# COMMON FIELDS
#   name     "@" for the apex, "www", or a full name (www.example.com)
#   ttl      seconds; 1 = automatic (default). Ignored when proxied.
#   comment  optional note shown in the Cloudflare dashboard
# ---------------------------------------------------------------------------
#   content  target hostname
#   proxied  true = orange cloud
#   Note: a CNAME at "@" works through Cloudflare CNAME flattening.
#   Microsoft 365 DKIM uses CNAMEs, so it goes here, not in dkim.yaml.
#
# www:
#   name: www
#   content: example.com
#   proxied: true
#
# m365_dkim_1:
#   name: selector1._domainkey
#   content: selector1-example-com._domainkey.tenant.onmicrosoft.com
