# ===========================================================================
# dns/dmarc.yaml: DMARC (what receivers do with mail that fails SPF/DKIM)
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Optional: subdomain_policy, pct (0-100), ruf, adkim/aspf (r or s), fo.
# raw overrides the builder. ttl: 1 = automatic; comment: text; quoted defaults to true.
#
# Published at _dmarc.<name>. The key is "@" for the domain itself.
#   policy   none (monitor) | quarantine (spam) | reject
#   rua      Addresses that receive daily summary reports.
#   raw      Complete DMARC text instead of the fields above.
#
# SAFE ROLLOUT: start with policy: none and an rua address, then tighten.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# "@":
#   policy: none
#   rua: [dmarc-reports@example.com]
#
# Check: python cf.py validate <domain>
