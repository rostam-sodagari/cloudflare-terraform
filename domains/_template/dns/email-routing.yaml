# ===========================================================================
# dns/email-routing.yaml: forward mail for this domain to real mailboxes
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# forward destinations must be verified; worker value is a Worker name; drop omits value.
# Catch-all forward/worker require destination. priority is optional; lower numbers run first.
# catch_all accepts name and enabled (default true).
#
#   enabled               true | false
#   support_subaddress     currently unsupported by the pinned provider;
#                          set it in Cloudflare and omit this field here
#   rules                  list of:
#     ref        required, stable identity
#     name       optional
#     enabled    optional, default true
#     matchers   list of { field: "to", type: "literal", value: <address> }
#     actions    list of { type: forward | worker | drop, value: [<dest>] }
#   catch_all              { action: forward | drop, destination: <address> }
#
# Destination addresses must already be verified with Cloudflare (it
# sends a confirmation e-mail the recipient has to click); this file
# doesn't request or track that verification.
# enabled: true enables routing on resource creation. Changing a managed
# service to false disables it by removing the settings resource. An initially
# false/unset service is left unmanaged; it cannot disable an unadopted service.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# enabled: true
# rules:
#   - ref: sales
#     matchers: [{field: "to", type: "literal", value: "sales@example.com"}]
#     actions: [{type: forward, value: [you@personal-email.com]}]
# catch_all:
#   action: forward
#   destination: you@personal-email.com
#
# Check: python cf.py validate <domain>
