# ===========================================================================
# dns/aaaa.yaml: AAAA records (name -> IPv6 address)
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
#   content  IPv6 address, e.g. 2001:db8::10.
#   proxied  As in a.yaml: true for websites, false for everything else.
#
# Keep entry keys stable; renaming them deletes and recreates resources.
#
# name: "@" for the zone or a label (www/mail); no trailing dot.
# ttl: 1 = automatic (default); otherwise 60-86400 seconds (30 minimum on Enterprise).
# Proxied TTL is automatic. comment: optional Cloudflare note.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# root_v6:
#   name: "@"
#   content: 2001:db8::10
#   proxied: true
#
# Check: python cf.py validate <domain>
