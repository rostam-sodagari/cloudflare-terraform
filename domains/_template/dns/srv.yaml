# ===========================================================================
# dns/srv.yaml: SRV records (service discovery, e.g. Teams, SIP)
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# priority/weight/port: integers 0-65535. Lower priority is preferred; weight shares traffic.
#
#   name      _service._protocol, e.g. _sip._tls
#   priority, weight, port, target   all required, from the service's setup guide
#
# Keep entry keys stable; renaming them deletes and recreates resources.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# m365_sip:
#   name: _sip._tls
#   priority: 100
#   weight: 1
#   port: 443
#   target: sipdir.online.lync.com
#
# Check: python cf.py validate <domain>
