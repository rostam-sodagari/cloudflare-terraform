# CAA records: which certificate authorities may issue for this domain.
# If you add any CAA record, include every CA you use, including the ones
# Cloudflare uses for edge certificates, or certificate renewals will fail.
# ---------------------------------------------------------------------------
# HOW KEYS WORK
#   The top-level key (e.g. "www") is the record's permanent ID in Terraform.
#   Renaming a key deletes and recreates the record. Change "name" or
#   "content" freely; never rename keys casually.
#
# COMMON FIELDS
#   name     "@" for the apex, "www", or a full name (www.example.com)
#   ttl      seconds; 1 = automatic (default). Ignored when proxied.
#   comment  optional note shown in the Cloudflare dashboard
# ---------------------------------------------------------------------------
#   tag    issue | issuewild | iodef
#   value  CA domain (or mailto: for iodef)
#   flags  0 (default) or 128 (critical)
#
# letsencrypt:
#   tag: issue
#   value: letsencrypt.org
# google:
#   tag: issue
#   value: pki.goog
# digicert:
#   tag: issue
#   value: digicert.com
# report:
#   tag: iodef
#   value: mailto:security@example.com
