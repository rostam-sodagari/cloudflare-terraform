# ===========================================================================
# dns/caa.yaml: CAA records (which certificate authorities may issue)
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# name defaults to '@'; flags defaults to 0 (integer 0-255). ttl/comment are optional.
#
#   tag    issue (certificates) | issuewild (wildcards) | iodef (report address)
#   value  The CA's domain, e.g. letsencrypt.org, or mailto:... for iodef.
#
# CAREFUL: once any CAA record exists, ONLY the listed CAs may issue. Keep
# letsencrypt.org and pki.goog or Cloudflare's own certificates can't renew.
#
# Keep entry keys stable; renaming them deletes and recreates resources.
#
# Optional fields and defaults: docs/yaml-fields.md
#
# EXAMPLE:
# letsencrypt:
#   tag: issue
#   value: letsencrypt.org
#
# Check: python cf.py validate <domain>
