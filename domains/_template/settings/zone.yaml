# Zone settings: setting_id: value. Leave a line commented to leave that
# setting unmanaged. Removing a line stops managing it; it does NOT reset it.
# Quote "on"/"off" so YAML keeps them as strings.
#
# Recommended baseline (uncomment):
# ssl: strict                       # off | flexible | full | strict
# min_tls_version: "1.2"            # 1.0 | 1.1 | 1.2 | 1.3
# tls_1_3: "on"
# always_use_https: "on"
# automatic_https_rewrites: "on"
# opportunistic_encryption: "on"
#
# Security:
# security_level: medium            # off | essentially_off | low | medium | high | under_attack
# browser_check: "on"
# email_obfuscation: "on"
#
# Caching and speed:
# browser_cache_ttl: 14400          # seconds; 0 = respect origin
# cache_level: aggressive           # basic | simplified | aggressive
# brotli: "on"
# early_hints: "on"
# http3: "on"
# 0rtt: "on"
#
# HSTS is in security/hsts.yaml, not here.
