# Request header transform rules (phase http_request_late_transform).
# Headers added on the way to the origin. Never put secrets in Git; use a
# Worker or mTLS / Authenticated Origin Pulls for origin authentication.
# Rules use the Cloudflare Rulesets API field names, so an example from the
# Cloudflare docs can be copied in (converted to YAML) unchanged.
#
#   ref                unique, stable id (required)
#   description        free text
#   expression         rules language; quote "true" so YAML keeps it a string
#   action_parameters  what to do (see examples)
#   enabled            default true
#   action             set automatically for this file; do not add it
#
# Limits per plan: free 10, pro 25, business 50, enterprise 300.
# Plan-only features are rejected by Cloudflare at plan time, so
# `make plan` tells you straight away if something is not allowed.
#
# - ref: tag_cf
#   description: Tell the origin the request came through Cloudflare
#   expression: "true"
#   action_parameters:
#     headers:
#       X-Via-Cloudflare:
#         operation: set          # set | add | remove
#         value: "1"
#       X-Client-Country:
#         operation: set
#         expression: ip.src.country
