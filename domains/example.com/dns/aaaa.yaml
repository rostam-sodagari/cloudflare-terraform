# AAAA records (IPv6). Same fields as a.yaml.
# ---------------------------------------------------------------------------
# HOW KEYS WORK
#   The top-level key (e.g. "www") is the record's permanent ID in Terraform.
#   Renaming a key deletes and recreates the record. Change "name" or
#   "content" freely; never rename keys casually.
#
# COMMON FIELDS
#   name     "@" for the apex, "www", or a full name (www.example.com)
#   ttl      seconds; 1 = automatic (default). Ignored when proxied.
#   comment  optional note shown in the Cloudflare dashboard
# ---------------------------------------------------------------------------
#
# root_v6:
#   name: "@"
#   content: 2001:db8::10
#   proxied: true
