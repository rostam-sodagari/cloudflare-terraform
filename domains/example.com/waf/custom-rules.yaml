- ref: allow_monitoring
  description: Skip remaining custom rules for uptime monitor
  expression: (ip.src in {198.51.100.10 198.51.100.11})
  action: skip
  skip:
    ruleset: current
- ref: block_bad_countries
  description: Block high risk countries on admin
  expression: (starts_with(http.request.uri.path, "/admin") and not ip.src.country in {"GB" "IE"})
  action: block
- ref: challenge_wp_login
  description: Challenge WordPress login
  expression: (http.request.uri.path eq "/wp-login.php")
  action: managed_challenge
