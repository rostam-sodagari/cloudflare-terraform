# Daily check: has anything been changed in the Cloudflare dashboard (or by
# another tool) since the last apply? Read-only; nothing is changed.
# For each root with drift, an issue labelled "drift" is opened or updated;
# when the drift is gone the issue is closed automatically.
name: cloudflare-drift

on:
  schedule:
    - cron: "30 6 * * 1-5"   # 06:30 UTC on weekdays
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  roots:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.r.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: echo "list=$(./scripts/changed-domains.sh --all)" >> "$GITHUB_OUTPUT"

  drift:
    needs: roots
    if: needs.roots.outputs.list != '[]'
    runs-on: ubuntu-latest
    environment: plan
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJson(needs.roots.outputs.list) }}
    concurrency:
      group: cloudflare-${{ matrix.root }}
      cancel-in-progress: false
    env:
      CI: "true"
      ROOT: ${{ matrix.root }}
      DIR: ${{ matrix.root == 'account' && 'account' || format('domains/{0}', matrix.root) }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16.0"
          terraform_wrapper: false
      - run: pip install -r requirements.txt
      - run: sed "s/<R2_ACCOUNT_ID>/${R2_ACCOUNT_ID}/" backend.hcl.example > backend.hcl

      - name: Compare Cloudflare with the last apply
        id: drift
        run: |
          set +e
          make drift D="$ROOT" DRIFT_EXIT=1 > drift.txt 2>&1
          rc=$?
          cat drift.txt
          python3 scripts/plan_summary.py "$DIR/drift.json" --root "$ROOT" --drift-only --format md > drift.md
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
          if [ $rc -eq 2 ]; then echo "state=drift" >> "$GITHUB_OUTPUT";
          elif [ $rc -eq 0 ]; then echo "state=clean" >> "$GITHUB_OUTPUT";
          else exit $rc; fi

      - name: Open or update the drift issue
        if: steps.drift.outputs.state == 'drift'
        run: |
          gh label create drift --color D93F0B --description "Cloudflare changed outside Git" --force >/dev/null
          title="Cloudflare drift: ${ROOT}"
          {
            cat drift.md
            echo
            echo "**What to do:** if the dashboard change should stay, copy it into the YAML in a pull request. If it should not, the next apply puts it back (the PR plan will show that). Details: docs/14-drift.md"
            echo
            echo "<sub>Found by the scheduled drift check on $(date -u +%Y-%m-%d). This issue closes itself when the drift is gone.</sub>"
          } > body.md
          num=$(gh issue list --label drift --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue edit "$num" --body-file body.md; else gh issue create --title "$title" --label drift --body-file body.md; fi

      - name: Close the drift issue when clean
        if: steps.drift.outputs.state == 'clean'
        run: |
          title="Cloudflare drift: ${ROOT}"
          num=$(gh issue list --label drift --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue close "$num" --comment "No drift on $(date -u +%Y-%m-%d). Closing."; fi
