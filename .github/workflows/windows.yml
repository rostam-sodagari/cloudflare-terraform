# Keeps cf.py working on Windows (it's the same file as on macOS/Linux, but
# this catches Windows-only path or subprocess issues). Offline only: no secrets.
name: windows

on:
  pull_request:
    paths: ["cf.py", "scripts/**", "modules/**", "domains/_template/**", ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16.0"
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Offline tests via cf.py
        run: python cf.py test-all

      - name: new-domain via cf.py
        run: |
          python cf.py new ci-check.example --zone-id 0123456789abcdef0123456789abcdef --plan pro
          python cf.py test ci-check.example
