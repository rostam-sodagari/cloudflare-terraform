# Plan or apply one root; approval comes from the current reviewed PR.
name: cloudflare-root

on:
  workflow_call:
    inputs:
      root: { type: string, required: true }
      mode: { type: string, required: true }
      # Keep in step with TF_VERSION in cloudflare.yml and deviation-detection.yml.
      tf_version: { type: string, required: false, default: "~1.16.0" }
      # Freshservice gate only: a workflow_dispatch has no merge commit to read
      # a PR number from. Empty on push, where the gate uses the merged PR.
      change_ref: { type: string, required: false, default: "" }

jobs:
  run:
    name: ${{ inputs.mode }} ${{ inputs.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.mode == 'apply' && 'production' || 'plan' }}
    concurrency:
      group: cloudflare-${{ inputs.root }}
      cancel-in-progress: false
    env:
      CI: "true"
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TF_IN_AUTOMATION: "1"
      ROOT: ${{ inputs.root }}
      DIR: ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          terraform-version: ${{ inputs.tf_version }}

      - name: Download the reviewed plan
        if: inputs.mode == 'apply'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan-${{ inputs.root }}
          path: ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}

      # verify chose this from the validated approvals before anything was
      # marked pending; the token makes Cloudflare's audit log name them.
      - name: Find the approver
        id: operator
        if: inputs.mode == 'apply'
        run: python3 scripts/ci_review.py operator "$ROOT" >> "$GITHUB_OUTPUT"

      - name: Fetch secrets from Delinea
        uses: ./.github/actions/fetch-delinea-secrets
        with:
          environment-name: ${{ inputs.mode == 'apply' && 'production' || 'plan' }}
          server-url: ${{ vars.TSS_SERVER_URL }}
          rule-name: ${{ vars.TSS_RULE_NAME }}
          onboarding-key: ${{ secrets.TSS_ONBOARDING_KEY }}
          secret-id: ${{ vars.TSS_SECRET_ID }}
          cli-url: ${{ vars.TSS_CLI_URL }}
          cli-sha256: ${{ vars.TSS_CLI_SHA256 }}
          freshservice-domain: ${{ vars.FRESHSERVICE_DOMAIN }}
          operator-secret-id: ${{ steps.operator.outputs.secret-id }}

      # To use plain GitHub Actions environment secrets instead of Delinea,
      # delete the step above and uncomment these four lines (then set
      # CLOUDFLARE_API_TOKEN/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY/
      # R2_ACCOUNT_ID as secrets on the "plan" and "production" environments):
      # env:
      #   CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #   AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      #   AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      #   R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::error::Delinea returned incomplete Cloudflare/R2 credentials for the '${{ inputs.mode == 'apply' && 'production' || 'plan' }}' environment."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.mode }}" = "apply" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Apply only runs from main."; exit 1
          fi

      # Optional business-process gate, separate from code review: confirms
      # the merged PR names an approved Freshservice change request before
      # anything is applied. Inactive unless FRESHSERVICE_DOMAIN is set as
      # a repository/environment variable -- skipped entirely otherwise.
      # Exact change ID and approval/window validation: scripts/change_gate.py.
      - name: Check the linked change request (Freshservice)
        if: inputs.mode == 'apply' && steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FRESHSERVICE_DOMAIN: ${{ vars.FRESHSERVICE_DOMAIN }}
          MERGE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CHANGE_REF_INPUT: ${{ inputs.change_ref }}
        run: |
          if [ -z "$FRESHSERVICE_DOMAIN" ]; then
            exit 0
          fi
          if [ -z "$FRESHSERVICE_API_KEY" ]; then
            echo "::error::FRESHSERVICE_DOMAIN is set but no 'freshservice-api-key' field was found on Delinea secret \${TSS_SECRET_ID}. Add it, or unset FRESHSERVICE_DOMAIN to disable this gate."
            exit 1
          fi

          # head_commit is empty on workflow_dispatch, so a manual recovery run
          # has to pass the reference in.
          if [ -n "$CHANGE_REF_INPUT" ]; then
            if ! printf '%s' "$CHANGE_REF_INPUT" | grep -qE '^CHG-[0-9]+$'; then
              echo "::error::change_ref '$CHANGE_REF_INPUT' is not of the form CHG-12345."
              exit 1
            fi
            ref="$CHANGE_REF_INPUT"
            echo "Change request from the workflow input: $ref"
          else
            pr=$(python3 scripts/ci_review.py merged-pr)
            if [ -z "$pr" ]; then
              echo "::error::Could not find a pull request number in the merge commit message. For a manually dispatched run, pass the change_ref input (CHG-12345) instead."
              exit 1
            fi
            body=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            ref=$(echo "$body" | grep -oE 'Change-Ref:[[:space:]]*CHG-[0-9]+' | grep -oE 'CHG-[0-9]+' | head -n1)
            if [ -z "$ref" ]; then
              echo "::error::PR #$pr has no 'Change-Ref: CHG-xxxxx' line in its description. Add one linking the approved Freshservice change request."
              exit 1
            fi
            echo "Change request from PR #$pr: $ref"
          fi

          if ! printf '%s' "$FRESHSERVICE_DOMAIN" | grep -qE '^[a-zA-Z0-9-]+$'; then
            echo "::error::FRESHSERVICE_DOMAIN must be the tenant subdomain."; exit 1
          fi
          change_id=$(printf '%s' "$ref" | sed 's/^CHG-0*//')
          if [ -z "$change_id" ]; then echo "::error::Invalid change ID."; exit 1; fi
          curl --fail --silent --show-error --connect-timeout 15 --max-time 60 \
            -u "${FRESHSERVICE_API_KEY}:X" \
            "https://${FRESHSERVICE_DOMAIN}.freshservice.com/api/v2/changes/${change_id}" > change.json
          python3 scripts/change_gate.py "$ref" change.json

      - name: Backend config (R2)
        if: steps.creds.outputs.ok == 'true'
        run: sed "s/<R2_ACCOUNT_ID>/${R2_ACCOUNT_ID}/" backend.hcl.example > backend.hcl

      # ------------------------------- plan -------------------------------
      - name: Plan
        if: inputs.mode == 'plan' && steps.creds.outputs.ok == 'true'
        run: |
          python3 scripts/ci_review.py snapshot "$ROOT"
          python3 cf.py plan "$ROOT"

      - name: Bind complete effects to this PR revision
        if: inputs.mode == 'plan' && github.event_name == 'pull_request'
        run: python3 scripts/ci_review.py build "$ROOT"

      - name: Verify the merged plan matches the reviewed PR
        if: inputs.mode == 'plan' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_review.py verify "$ROOT"

      - name: Save immutable PR review evidence
        if: inputs.mode == 'plan' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}-${{ inputs.root }}
          path: |
            ${{ env.DIR }}/.review.json
            ${{ env.DIR }}/plan-details.md
          overwrite: true
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error

      - name: Change summary on the run page
        if: inputs.mode == 'plan' && steps.creds.outputs.ok == 'true'
        run: |
          cat "$DIR/plan-summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n<sub>Plan from commit %s.</sub>\n' "${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Change summary on the pull request
        if: inputs.mode == 'plan' && steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- cloudflare-plan:${ROOT} -->"
          {
            echo "$marker"
            head -c 50000 "$DIR/plan-summary.md"
            echo
            echo "Complete effects are in the review artifact on this run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. A shortened comment is not the complete report."
            echo
            echo "<sub>Planned from commit ${SHA::7}; this comment updates on every push. Approving the PR approves these changes. A second user must approve this revision after this report. Merge deploys only matching effects; changed live configuration requires fresh PR review.</sub>"
          } > comment.md
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Save the plan for the apply job
        if: inputs.mode == 'plan' && steps.creds.outputs.ok == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ inputs.root }}
          path: |
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/plan.bin
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/plan.json
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/plan-summary.md
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/.plan-input.sha256
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/.plan-revision
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/.terraform.lock.hcl
            ${{ env.DIR }}/.inventory.json
            ${{ env.DIR }}/.review.json
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true   # keeps .terraform.lock.hcl, so apply uses the same provider build

      # ------------------------------- apply ------------------------------
      - name: Verify main has not advanced since planning
        if: inputs.mode == 'apply'
        run: |
          planned=$(cat "$DIR/.plan-revision")
          current=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ -z "$planned" ] || [ "$planned" = "no-git" ] || [ "$planned" != "$current" ]; then
            echo "::error::Main advanced after this plan was created. Re-run the plan before applying."
            exit 1
          fi

      - name: Apply exactly the reviewed plan
        if: inputs.mode == 'apply'
        run: |
          {
            echo "## Applying to ${ROOT}"
            cat "$DIR/plan-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 cf.py init "$ROOT"
          set -o pipefail
          python3 cf.py apply "$ROOT" 2>&1 | tee "$DIR/apply.log"

      - name: Confirm Cloudflare now matches the YAML
        if: inputs.mode == 'apply'
        run: |
          python3 cf.py plan "$ROOT"
          if ! grep -q "Nothing will change" "$DIR/plan-summary.md"; then
            python3 scripts/ci_review.py complete "$ROOT"
            echo "::error::After apply, a new plan still shows changes. The deployment did not converge."
            { echo "## Plan after apply (should be empty)"; cat "$DIR/plan-summary.md"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 scripts/ci_review.py complete "$ROOT"

      - name: Report actual configuration after deployment
        if: always() && inputs.mode == 'apply' && steps.creds.outputs.ok == 'true'
        run: python3 scripts/ci_review.py outcome "$ROOT" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain deployment and partial-failure evidence
        if: always() && inputs.mode == 'apply'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-${{ inputs.root }}
          path: |
            ${{ env.DIR }}/plan-summary.md
            ${{ env.DIR }}/plan.log
            ${{ env.DIR }}/apply.log
            ${{ env.DIR }}/deployment-outcome.json
            ${{ env.DIR }}/.review.json
            ${{ env.DIR }}/.inventory.json
          retention-days: 7
          include-hidden-files: true
