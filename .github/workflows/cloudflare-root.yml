# Plan or apply ONE root (a domain folder name, or "account").
#
# mode: plan   uses the "plan" environment (read-only Cloudflare token),
#              writes a change summary to the run page and the PR, and saves
#              the plan as an artifact.
# mode: apply  uses the "production" environment (edit token, required
#              reviewers), downloads that exact saved plan and applies it.
#              If another apply changed the state since the plan,
#              Terraform refuses it as stale and nothing is applied.
name: cloudflare-root

on:
  workflow_call:
    inputs:
      root: { type: string, required: true }
      mode: { type: string, required: true }
      # Keep in step with TF_VERSION in cloudflare.yml and deviation-detection.yml.
      tf_version: { type: string, required: false, default: "~1.16.0" }
      # Only used by the optional Freshservice gate, and only needed when the
      # run has no merge commit to read a PR number from -- i.e. a manual
      # workflow_dispatch. On a push to main this stays empty and the gate
      # finds the change reference through the merged pull request instead.
      change_ref: { type: string, required: false, default: "" }

jobs:
  run:
    name: ${{ inputs.mode }} ${{ inputs.root }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.mode == 'apply' && 'production' || 'plan' }}
    concurrency:
      group: cloudflare-${{ inputs.root }}
      cancel-in-progress: false
    env:
      CI: "true"
      TF_IN_AUTOMATION: "1"
      ROOT: ${{ inputs.root }}
      DIR: ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ inputs.tf_version }}
          terraform_wrapper: false
      - run: pip install -r requirements.txt

      # Pulls CLOUDFLARE_API_TOKEN / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
      # / R2_ACCOUNT_ID from Delinea DevOps Secrets Vault (the only secrets
      # GitHub itself holds are the DSV client credentials below, scoped
      # per-environment: "plan" gets read-only Delinea access, "production"
      # gets the edit-scoped secrets). See docs/30-setup.md for the
      # one-time DSV setup and exactly what DSV_SECRET_PATH points to.
      #
      # Verify the CLI install step against Delinea's current docs before
      # relying on this -- the download URL below is correct as of writing
      # but isn't pinned to a version.
      - name: Fetch secrets from Delinea
        env:
          DSV_CLIENT_ID: ${{ secrets.DSV_CLIENT_ID }}
          DSV_CLIENT_SECRET: ${{ secrets.DSV_CLIENT_SECRET }}
          DSV_TENANT: ${{ vars.DSV_TENANT }}
          DSV_SECRET_PATH: ${{ vars.DSV_SECRET_PATH }}
          DSV_CLI_URL: ${{ vars.DSV_CLI_URL }}
          DSV_CLI_SHA256: ${{ vars.DSV_CLI_SHA256 }}
          FRESHSERVICE_DOMAIN: ${{ vars.FRESHSERVICE_DOMAIN }}
        run: |
          if [ -z "$DSV_CLIENT_ID" ] || [ -z "$DSV_CLIENT_SECRET" ] || [ -z "$DSV_TENANT" ] || [ -z "$DSV_SECRET_PATH" ]; then
            echo "::error::Delinea client configuration is incomplete in the '${{ inputs.mode == 'apply' && 'production' || 'plan' }}' environment."
            exit 1
          fi
          if [ -z "$DSV_CLI_URL" ] || [ -z "$DSV_CLI_SHA256" ]; then
            echo "::error::DSV_CLI_URL and DSV_CLI_SHA256 must be configured as environment variables before this workflow can run."
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 3 "$DSV_CLI_URL" -o /usr/local/bin/dsv
          echo "$DSV_CLI_SHA256  /usr/local/bin/dsv" | sha256sum --check --strict
          chmod +x /usr/local/bin/dsv
          dsv init --tenant "$DSV_TENANT" --client-id "$DSV_CLIENT_ID" --client-secret "$DSV_CLIENT_SECRET" --save-config false

          # GitHub only masks values it already knows about -- the secrets.*
          # above. A value fetched at runtime is NOT masked automatically, so
          # without ::add-mask:: the Cloudflare edit token and the R2 keys
          # appear in cleartext the moment any later step echoes one or a tool
          # quotes it back in an error. Registering them here covers the rest
          # of the job. The heredoc form of GITHUB_ENV is used so a newline
          # inside a value cannot go on to define further variables.
          # Failures stay quiet on purpose: "Check credentials" below turns an
          # empty value into one clear message.
          put_secret() {
            local name="$1" path="$2" value
            value=$(dsv secret read "${DSV_SECRET_PATH}:${path}" --data.value) || return 1
            if [ -z "$value" ]; then return 1; fi
            echo "::add-mask::$value"
            {
              echo "${name}<<__DSV_EOF__"
              echo "$value"
              echo "__DSV_EOF__"
            } >> "$GITHUB_ENV"
          }
          put_secret CLOUDFLARE_API_TOKEN  cloudflare-api-token || true
          put_secret AWS_ACCESS_KEY_ID     r2-access-key-id     || true
          put_secret AWS_SECRET_ACCESS_KEY r2-secret-access-key || true
          put_secret R2_ACCOUNT_ID         r2-account-id        || true
          # Only needed when the Freshservice change-request gate below is
          # enabled (FRESHSERVICE_DOMAIN set as a repository/environment
          # variable); most repos using this workflow won't have one.
          if [ -n "$FRESHSERVICE_DOMAIN" ]; then
            put_secret FRESHSERVICE_API_KEY freshservice-api-key || true
          fi

      # To use plain GitHub Actions environment secrets instead of Delinea,
      # delete the step above and uncomment these four lines (then set
      # CLOUDFLARE_API_TOKEN/R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY/
      # R2_ACCOUNT_ID as secrets on the "plan" and "production" environments):
      # env:
      #   CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #   AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      #   AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      #   R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ]; then
            echo "::error::Delinea returned incomplete Cloudflare/R2 credentials for the '${{ inputs.mode == 'apply' && 'production' || 'plan' }}' environment."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.mode }}" = "apply" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Apply only runs from main."; exit 1
          fi

      # Optional business-process gate, separate from code review: confirms
      # the merged PR names an approved Freshservice change request before
      # anything is applied. Inactive unless FRESHSERVICE_DOMAIN is set as
      # a repository/environment variable -- skipped entirely otherwise.
      # The API endpoint and field names below (status, planned_start_date,
      # planned_end_date) are placeholders written against Freshservice's
      # documented shape as of writing; verify them against your own
      # instance before relying on this gate.
      - name: Check the linked change request (Freshservice)
        if: inputs.mode == 'apply' && steps.creds.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FRESHSERVICE_DOMAIN: ${{ vars.FRESHSERVICE_DOMAIN }}
          MERGE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CHANGE_REF_INPUT: ${{ inputs.change_ref }}
        run: |
          if [ -z "$FRESHSERVICE_DOMAIN" ]; then
            exit 0
          fi
          if [ -z "$FRESHSERVICE_API_KEY" ]; then
            echo "::error::FRESHSERVICE_DOMAIN is set but no 'freshservice-api-key' secret was found in Delinea at \${DSV_SECRET_PATH}. Add it, or unset FRESHSERVICE_DOMAIN to disable this gate."
            exit 1
          fi

          # Where the change reference comes from. github.event.head_commit is
          # empty on a workflow_dispatch, so without the input below a manual
          # run -- the documented way to put Cloudflare back after a deviation
          # -- could never satisfy this gate.
          if [ -n "$CHANGE_REF_INPUT" ]; then
            if ! printf '%s' "$CHANGE_REF_INPUT" | grep -qE '^CHG-[0-9]+$'; then
              echo "::error::change_ref '$CHANGE_REF_INPUT' is not of the form CHG-12345."
              exit 1
            fi
            ref="$CHANGE_REF_INPUT"
            echo "Change request from the workflow input: $ref"
          else
            pr=$(printf '%s\n' "$MERGE_COMMIT_MESSAGE" | grep -oE '#[0-9]+' | head -n1 | tr -d '#')
            if [ -z "$pr" ]; then
              echo "::error::Could not find a pull request number in the merge commit message. For a manually dispatched run, pass the change_ref input (CHG-12345) instead."
              exit 1
            fi
            body=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            ref=$(echo "$body" | grep -oE 'Change-Ref:[[:space:]]*CHG-[0-9]+' | grep -oE 'CHG-[0-9]+' | head -n1)
            if [ -z "$ref" ]; then
              echo "::error::PR #$pr has no 'Change-Ref: CHG-xxxxx' line in its description. Add one linking the approved Freshservice change request."
              exit 1
            fi
            echo "Change request from PR #$pr: $ref"
          fi

          resp=$(curl -fsS -u "${FRESHSERVICE_API_KEY}:X" \
            "https://${FRESHSERVICE_DOMAIN}.freshservice.com/api/v2/changes?ref=${ref}")

          # Never trust that the query filtered anything. If ?ref= is not a
          # supported filter on this instance, Freshservice happily returns a
          # list of unrelated changes, and reading .changes[0] blindly would
          # approve every apply as long as *some* change somewhere was approved
          # and in window. Require exactly one record, and require it to
          # actually mention the reference we asked for.
          count=$(echo "$resp" | jq '.changes | length')
          if [ "$count" != "1" ]; then
            echo "::error::Freshservice returned ${count} change(s) for ${ref}; expected exactly 1. The '?ref=' filter may not be supported on your instance -- verify the endpoint (see the comment above this step). Apply blocked."
            exit 1
          fi
          if [ "$(echo "$resp" | jq -r --arg r "$ref" '[.changes[0] | .. | strings] | any(contains($r))')" != "true" ]; then
            echo "::error::The change Freshservice returned does not mention ${ref} anywhere, so it is not the linked change request. Apply blocked."
            exit 1
          fi

          status=$(echo "$resp" | jq -r '.changes[0].status')
          start=$(echo "$resp" | jq -r '.changes[0].planned_start_date')
          end=$(echo "$resp" | jq -r '.changes[0].planned_end_date')
          if [ "$status" != "Approved" ]; then
            echo "::error::$ref is not Approved in Freshservice (status: $status). Apply blocked."
            exit 1
          fi
          if [ -z "$start" ] || [ "$start" = "null" ] || [ -z "$end" ] || [ "$end" = "null" ]; then
            echo "::error::$ref is Approved but has no planned start/end window in Freshservice. Apply blocked."
            exit 1
          fi
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [[ "$now" < "$start" || "$now" > "$end" ]]; then
            echo "::error::$ref is approved but outside its planned window ($start to $end). Apply blocked."
            exit 1
          fi
          echo "$ref is Approved and within its planned window ($start to $end)."

      - name: Backend config (R2)
        if: steps.creds.outputs.ok == 'true'
        run: sed "s/<R2_ACCOUNT_ID>/${R2_ACCOUNT_ID}/" backend.hcl.example > backend.hcl

      # ------------------------------- plan -------------------------------
      - name: Plan
        if: inputs.mode == 'plan' && steps.creds.outputs.ok == 'true'
        run: python3 cf.py plan "$ROOT"

      - name: Change summary on the run page
        if: inputs.mode == 'plan' && steps.creds.outputs.ok == 'true'
        run: |
          cat "$DIR/plan-summary.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\n<sub>Plan from commit %s.</sub>\n' "${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Change summary on the pull request
        if: inputs.mode == 'plan' && steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker="<!-- cloudflare-plan:${ROOT} -->"
          {
            echo "$marker"
            head -c 60000 "$DIR/plan-summary.md"
            echo
            echo "<sub>Planned from commit ${SHA::7}; this comment updates on every push. Approving the PR approves these changes. After merge they are planned again and need approval in the production environment before anything is applied.</sub>"
          } > comment.md
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --body-file comment.md
          fi

      - name: Save the plan for the apply job
        if: inputs.mode == 'plan' && steps.creds.outputs.ok == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plan-${{ inputs.root }}
          path: |
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/plan.bin
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/plan.json
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/plan-summary.md
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/.plan-input.sha256
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/.plan-revision
            ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}/.terraform.lock.hcl
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true   # keeps .terraform.lock.hcl, so apply uses the same provider build

      # ------------------------------- apply ------------------------------
      - name: Download the reviewed plan
        if: inputs.mode == 'apply'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plan-${{ inputs.root }}
          path: ${{ inputs.root == 'account' && 'account' || format('domains/{0}', inputs.root) }}

      - name: Verify main has not advanced since planning
        if: inputs.mode == 'apply'
        run: |
          planned=$(cat "$DIR/.plan-revision")
          current=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ -z "$planned" ] || [ "$planned" = "no-git" ] || [ "$planned" != "$current" ]; then
            echo "::error::Main advanced after this plan was created. Re-run the plan before applying."
            exit 1
          fi

      - name: Apply exactly the reviewed plan
        if: inputs.mode == 'apply'
        run: |
          {
            echo "## Applying to ${ROOT}"
            cat "$DIR/plan-summary.md"
          } >> "$GITHUB_STEP_SUMMARY"
          python3 cf.py init "$ROOT"
          python3 cf.py apply "$ROOT"

      - name: Confirm Cloudflare now matches the YAML
        if: inputs.mode == 'apply'
        run: |
          python3 cf.py plan "$ROOT"
          if ! grep -q "Nothing will change" "$DIR/plan-summary.md"; then
            echo "::error::After apply, a new plan still shows changes. The deployment did not converge."
            { echo "## Plan after apply (should be empty)"; cat "$DIR/plan-summary.md"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
