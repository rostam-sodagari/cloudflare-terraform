# Keeps cf.ps1 and new-domain.ps1 working on Windows. Offline only: no secrets.
name: windows-scripts

on:
  pull_request:
    paths: ["cf.ps1", "scripts/**", "modules/**", "domains/_template/**", ".github/workflows/windows-scripts.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16.0"
          terraform_wrapper: false

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      - name: Offline tests via cf.ps1 (PowerShell 7)
        shell: pwsh
        run: .\cf.ps1 test-all

      - name: new-domain via Windows PowerShell 5.1
        shell: powershell
        run: |
          .\cf.ps1 new ci-check.example -ZoneId 0123456789abcdef0123456789abcdef -Plan pro
          .\cf.ps1 test ci-check.example
