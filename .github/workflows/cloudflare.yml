# PR plans require a second user review. Merge deploys only matching effects.
name: cloudflare

on:
  pull_request:
    paths: ["domains/**", "account/**", "modules/**", "scripts/**", "tests/**", "requirements*.txt", "policy.yaml", "backend.hcl.example", "cf.py", ".github/workflows/**", ".github/actions/**", ".github/cloudflare-operators.yml"]
  push:
    branches: [main]
    paths: ["domains/**", "account/**", "modules/**", "scripts/**", "tests/**", "requirements*.txt", "policy.yaml", "backend.hcl.example", "cf.py", ".github/workflows/**", ".github/actions/**", ".github/cloudflare-operators.yml"]
  workflow_dispatch:
    inputs:
      root:
        description: "Retry a root on an eligible reviewed merged revision (or 'account'). Restore configuration through a new PR."
        required: true
        type: string
      change_ref:
        description: "Approved Freshservice change request, e.g. CHG-12345. Only needed when the Freshservice gate is enabled (FRESHSERVICE_DOMAIN set); a dispatched run has no merge commit to read a PR number from."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('cloudflare-pr-{0}', github.event.pull_request.number) || 'cloudflare-operations' }}
  cancel-in-progress: false

env:
  TF_VERSION: "~1.16.0" # latest 1.16.x; >= 1.10 is required for the S3 lockfile

jobs:
  # ---------------------------------------------------------------------
  # Offline checks: no secrets, run on every PR, including from forks.
  # ---------------------------------------------------------------------
  checks:
    name: Validate configuration and run tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          terraform-version: ${{ env.TF_VERSION }}
      - name: Validate YAML (errors appear on the changed lines of the PR)
        run: python3 scripts/validate.py --all
      - name: Terraform formatting
        run: terraform fmt -recursive -check
      - name: Offline plan tests (mocked Cloudflare)
        run: python3 cf.py test-all
      - name: Unit tests (validator, exporter, change summary)
        run: python3 -m unittest discover -s tests -v
      - name: End-to-end test against a local stand-in for the Cloudflare API
        run: python3 tests/e2e/run.py

  detect:
    name: Find changed roots
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.select-roots.outputs.account }}
      domains: ${{ steps.select-roots.outputs.domains }}
      deployable: ${{ steps.select-roots.outputs.deployable }}
    steps:
      - name: Check out repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
      - name: Select roots and deployment eligibility
        id: select-roots
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_INPUT: ${{ inputs.root }}
        run: |
          deployable=false
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            if python3 scripts/ci_review.py merged-pr; then deployable=true; fi
          fi
          echo "deployable=$deployable" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            root="$ROOT_INPUT"
            all=$(python3 cf.py changed-domains --all)
            if ! jq -e --arg r "$root" 'index($r) != null' <<<"$all" >/dev/null; then
              echo "::error::'$root' is not a domain folder (or is an example). Known: $all"; exit 1
            fi
            roots=$(jq -nc --arg r "$root" '[$r]')
          else
            roots=$(python3 cf.py changed-domains "$base")
          fi
          echo "Roots to plan: $roots"
          echo "account=$(jq -r 'index("account") != null' <<<"$roots")" >> "$GITHUB_OUTPUT"
          echo "domains=$(jq -c 'map(select(. != "account"))' <<<"$roots")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Plan. Account first so lists exist before domains reference them.
  # ---------------------------------------------------------------------
  plan-account:
    name: Plan account
    needs: [checks, detect]
    if: needs.detect.outputs.account == 'true' && (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || needs.detect.outputs.deployable == 'true')
    permissions:
      contents: read
      pull-requests: write
      actions: read
    uses: ./.github/workflows/cloudflare-root.yml
    with: { root: account, mode: plan }
    secrets: inherit

  plan-domains:
    name: Plan domain
    needs: [checks, detect, plan-account]
    if: >-
      always() && needs.checks.result == 'success' && needs.detect.result == 'success' && needs.detect.outputs.domains != '[]' &&
      (needs.detect.outputs.account == 'true' && needs.plan-account.result == 'success' || needs.detect.outputs.account != 'true' && needs.plan-account.result == 'skipped') &&
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository || needs.detect.outputs.deployable == 'true')
    permissions:
      contents: read
      pull-requests: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        root: ${{ fromJson(needs.detect.outputs.domains) }}
    uses: ./.github/workflows/cloudflare-root.yml
    with: { root: "${{ matrix.root }}", mode: plan }
    secrets: inherit

  # ---------------------------------------------------------------------
  # Apply (main only) uses the PR approval and saved verified plan.
  # ---------------------------------------------------------------------
  apply-account:
    name: Apply account
    needs: [detect, plan-account, plan-domains]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' && needs.detect.outputs.deployable == 'true' && needs.plan-account.result == 'success' &&
      (needs.detect.outputs.domains != '[]' && needs.plan-domains.result == 'success' || needs.detect.outputs.domains == '[]' && needs.plan-domains.result == 'skipped')
    uses: ./.github/workflows/cloudflare-root.yml
    with: { root: account, mode: apply, change_ref: "${{ inputs.change_ref }}" }
    secrets: inherit

  apply-domains:
    name: Apply domain
    needs: [detect, plan-domains, apply-account]
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' &&
      needs.detect.outputs.deployable == 'true' && needs.plan-domains.result == 'success' &&
      (needs.detect.outputs.account == 'true' && needs.apply-account.result == 'success' || needs.detect.outputs.account != 'true' && needs.apply-account.result == 'skipped')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        root: ${{ fromJson(needs.detect.outputs.domains) }}
    uses: ./.github/workflows/cloudflare-root.yml
    with: { root: "${{ matrix.root }}", mode: apply, change_ref: "${{ inputs.change_ref }}" }
    secrets: inherit
