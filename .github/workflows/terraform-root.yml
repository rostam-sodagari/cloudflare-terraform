# Plan (and on main, apply) one root: "account" or a domain folder name.
name: terraform-root

on:
  workflow_call:
    inputs:
      root:
        type: string
        required: true

env:
  TF_IN_AUTOMATION: "1"
  TF_VERSION: "1.10.5" # pin to the version your team uses (>= 1.10 for the S3 lockfile)

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: cf-${{ inputs.root }}
      cancel-in-progress: false
    environment: ${{ github.event_name == 'push' && 'production' || 'plan' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format and offline tests (no secrets needed)
        run: |
          terraform fmt -recursive -check
          make test D=${{ inputs.root }}

      # ------------------------------------------------------------------
      # Replace with your Delinea step. It must export to $GITHUB_ENV:
      #   CLOUDFLARE_API_TOKEN                        Cloudflare API token
      #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY   R2 state bucket keys
      #   R2_ACCOUNT_ID                               account holding the bucket
      # Use a read-only Cloudflare token in the 'plan' environment and the
      # edit token only in 'production'.
      # ------------------------------------------------------------------
      - name: Fetch secrets from Delinea
        run: |
          echo "TODO - add Delinea secret retrieval here" && exit 1

      - name: Backend config (R2)
        run: sed "s/<R2_ACCOUNT_ID>/${R2_ACCOUNT_ID}/" backend.hcl.example > backend.hcl

      - name: Plan
        run: |
          make plan D=${{ inputs.root }}
          dir=$([ "${{ inputs.root }}" = account ] && echo account || echo "domains/${{ inputs.root }}")
          {
            echo "### ${{ inputs.root }}"
            echo '```'
            terraform -chdir="$dir" show -no-color plan.bin | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply (main only, after environment approval)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make apply D=${{ inputs.root }}
