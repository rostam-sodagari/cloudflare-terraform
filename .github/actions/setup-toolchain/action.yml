# Python, the packages in requirements.txt and optionally Terraform.
# Every job that runs cf.py or scripts/ needs this: they import PyYAML.
name: Set up toolchain
description: Install Python, the repository's Python packages and optionally Terraform.

inputs:
  terraform-version:
    description: Terraform version constraint. Leave empty for jobs that do not run Terraform.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with: { python-version: "3.12" }

    - name: Install Terraform
      if: inputs.terraform-version != ''
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: Install Python packages
      shell: bash
      run: pip install -r requirements.txt
