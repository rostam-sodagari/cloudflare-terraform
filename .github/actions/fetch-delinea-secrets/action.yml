# Pulls CLOUDFLARE_API_TOKEN / AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
# / R2_ACCOUNT_ID from Delinea Secret Server into the job's environment (the
# only secret GitHub itself holds is the application account's password, scoped
# per-environment: each environment has its own account and secret, and only
# "production" can read approvers' personal tokens). Needs the setup-toolchain
# action first. See docs/setup.md for the one-time setup.
name: Fetch secrets from Delinea
description: Export Cloudflare and R2 credentials to the job environment.

inputs:
  environment-name:
    description: GitHub environment supplying these values; shown in configuration errors.
    required: true
  server-url:
    description: Secret Server URL.
    required: true
  username:
    description: Application account username.
    required: true
  password:
    description: Application account password.
    required: true
  domain:
    description: Login domain, for a domain account.
    required: false
    default: ""
  secret-id:
    description: Numeric ID of this environment's secret.
    required: true
  approver-folder:
    description: Folder holding one sub-folder per approver, named after their GitHub login.
    required: false
    default: ""
  approvers:
    description: Space-separated eligible approvers, oldest first. Replaces CLOUDFLARE_API_TOKEN with the latest one's token.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Check Secret Server configuration
      shell: bash
      env:
        ENVIRONMENT_NAME: ${{ inputs.environment-name }}
        TSS_SERVER_URL: ${{ inputs.server-url }}
        TSS_USERNAME: ${{ inputs.username }}
        TSS_PASSWORD: ${{ inputs.password }}
        TSS_SECRET_ID: ${{ inputs.secret-id }}
        TSS_APPROVER_FOLDER: ${{ inputs.approver-folder }}
        APPROVERS: ${{ inputs.approvers }}
      run: |
        if [ -z "$TSS_SERVER_URL" ] || [ -z "$TSS_USERNAME" ] || [ -z "$TSS_PASSWORD" ] || [ -z "$TSS_SECRET_ID" ]; then
          echo "::error::Secret Server configuration is incomplete in the '$ENVIRONMENT_NAME' environment."
          exit 1
        fi
        if [ -n "$APPROVERS" ] && [ -z "$TSS_APPROVER_FOLDER" ]; then
          echo "::error::TSS_APPROVER_FOLDER must be configured in the '$ENVIRONMENT_NAME' environment."
          exit 1
        fi

    - name: Export credentials to the job environment
      shell: bash
      env:
        TSS_SERVER_URL: ${{ inputs.server-url }}
        TSS_USERNAME: ${{ inputs.username }}
        TSS_PASSWORD: ${{ inputs.password }}
        TSS_DOMAIN: ${{ inputs.domain }}
        TSS_SECRET_ID: ${{ inputs.secret-id }}
        TSS_APPROVER_FOLDER: ${{ inputs.approver-folder }}
        APPROVERS: ${{ inputs.approvers }}
      run: python3 scripts/delinea_secrets.py
