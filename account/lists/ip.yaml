# ===========================================================================
# account/lists/ip.yaml
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Required per list: items (IP addresses or CIDR ranges); description is optional.
# Names: lowercase letters, digits and _ (max 50); reference as $list_name in rules.
# Create lists before using them; remove rule references before deleting them.
#
# EXAMPLE:
# trusted_offices:
#   description: Office egress addresses
#   items:
#     - 203.0.113.7
#     - ip: 2001:db8::/48
#       comment: IPv6 office network
#
# Optional fields and defaults: docs/yaml-fields.md
#
# Check: python cf.py validate account

office_ips:
  description: Office egress addresses
  items:
    - ip: 203.0.113.0/24
      comment: Head office
