# Bulk Redirects: one list per site or campaign. Each enabled list gets an
# account-level rule automatically; nothing to add in the domain folders.
# Good for hundreds of fixed URL-to-URL redirects. For pattern-based
# redirects use domains/<d>/rules/redirects.yaml.
#
#   source_url             without scheme, e.g. example.com/old
#   target_url             full URL
#   status_code            301 (default) | 302 | 307 | 308
#   preserve_query_string  true | false
#   subpath_matching       true: /old/* also matches
#   preserve_path_suffix   with subpath_matching: keep the rest of the path
#   include_subdomains     true: also matches sub.example.com/old
#   enabled                (list level) false keeps the list but turns off the rule
#
# marketing_2026:
#   description: Retired campaign pages
#   items:
#     - source_url: example.com/summer
#       target_url: https://example.com/offers
#     - source_url: example.com/blog/old
#       target_url: https://example.com/news
#       subpath_matching: true
#       preserve_path_suffix: true
