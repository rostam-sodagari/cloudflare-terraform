# ===========================================================================
# account/lists/redirect.yaml
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Required: items with source_url (no scheme) and target_url (full URL).
# status_code: 301 (default), 302, 307, 308. enabled: false disables the list rule.
# preserve_path_suffix requires subpath_matching: true; other flags are optional booleans.
#
# EXAMPLE:
# retired_pages:
#   description: Redirect old documentation
#   enabled: true
#   items:
#     - source_url: example.com/old-docs
#       target_url: https://example.com/docs
#       status_code: 301
#       subpath_matching: true
#       preserve_path_suffix: true
#       preserve_query_string: true
#
# Optional fields and defaults: docs/yaml-fields.md
#
# Check: python cf.py validate account
