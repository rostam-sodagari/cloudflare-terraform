# ===========================================================================
# account/settings/dns-settings.yaml
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# enforce_dns_only: optional boolean; true bypasses proxying account-wide.
# zone_defaults: optional mapping for NEW zones only; nested fields are in the reference.
#
# EXAMPLE:
# enforce_dns_only: false
# zone_defaults:
#   flatten_all_cnames: false
#   nameservers:
#     type: cloudflare.standard
#   ns_ttl: 86400
#
# EXAMPLE (optional SOA block inside zone_defaults):
#   soa:
#     refresh: 3600
#     retry: 600
#     expire: 604800
#     min_ttl: 300
#     ttl: 3600
#
# Optional fields and defaults: docs/yaml-fields.md
#
# Check: python cf.py validate account
