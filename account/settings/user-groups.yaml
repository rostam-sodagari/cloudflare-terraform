# ===========================================================================
# account/settings/user-groups.yaml
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# policies/members: optional lists; use real IDs from the account IAM/member APIs.
# Policy access: allow/deny; permission_groups/resource_groups use {id: ...} objects.
# members contains Account Member IDs, not email addresses.
#
# EXAMPLE:
# network_team:
#   policies:
#     - access: allow
#       permission_groups:
#         - id: "<dns-read-permission-group-id>"
#       resource_groups:
#         - id: "<zones-resource-group-id>"
#   members:
#     - "<account-member-id>"
#
#
# Optional fields and defaults: docs/yaml-fields.md
#
# Check: python cf.py validate account
