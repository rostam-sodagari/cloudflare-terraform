# ===========================================================================
# account/settings/logpush.yaml
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Required per job: dataset and destination_conf OR destination_conf_ref; enabled defaults to true.
# Use destination_conf_ref for a vault destination containing credentials.
# filter is JSON text; frequency is high/low. Verify the destination first.
# frequency/logpull_options are legacy fields; newer output_options is not modeled here.
#
# EXAMPLE:
# audit_archive:
#   dataset: audit_logs
#   destination_conf: "s3://my-cf-logs/audit?region=us-east-1"
#   enabled: true
#
# EXAMPLE (optional filter within a job):
#   filter: '{"where":{"key":"Action","operator":"eq","value":"login"}}'
#
# Optional fields and defaults: docs/yaml-fields.md
#
# Check: python cf.py validate account
