# ===========================================================================
# account/settings/notifications.yaml
# ===========================================================================
#
# Uncomment one example's config lines; keep indentation and replace sample values.
# Syntax: docs/configuration.md. Validate and review the plan before applying.
#
# Required: alert_type and mechanisms with email, webhooks or pagerduty lists.
# webhooks names come from notification-webhooks.yaml; enabled defaults to true.
# filters/alert_interval depend on the alert type.
#
# EXAMPLE:
# ddos_alerts:
#   alert_type: dos_attack_l7
#   description: Notify the security team about HTTP DDoS attacks
#   enabled: true
#   mechanisms:
#     email:
#       - security@example.com
#
# EXAMPLE (optional, add within mechanisms after defining the destination):
#     webhooks:
#       - security_team
#
# Optional fields and defaults: docs/yaml-fields.md
#
# Check: python cf.py validate account
